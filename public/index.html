<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namuna — Collection 01 · Range Review</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="description" content="Private range review. View only.">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Expanded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --bg2:#e7e3dc; --ink:#2a1b18; --mute:#7a6c66; --line:#d6d0c6; --accent:#5c1d22;
  --bar:rgba(244,242,238,.88);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171210;--bg2:#211a17;--ink:#efe9e1;--mute:#a09389;--line:#352c28;--accent:#d98a8f;--bar:rgba(23,18,16,.88)}
}
:root[data-theme="dark"]{--bg:#171210;--bg2:#211a17;--ink:#efe9e1;--mute:#a09389;--line:#352c28;--accent:#d98a8f;--bar:rgba(23,18,16,.88)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
img,canvas{-webkit-user-drag:none;user-drag:none}

/* top bar */
header{
  position:fixed;inset:0 0 auto 0;z-index:20;height:56px;padding:0 max(16px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:20px;background:var(--bar);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.brand{font:700 15px/1 "Archivo Expanded",Archivo,sans-serif;letter-spacing:.18em}
.brand small{font:500 12px Archivo;letter-spacing:.04em;color:var(--mute);margin-left:10px}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button,.tools button{
  font:500 12px/1 Archivo;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  background:none;border:0;padding:10px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;
}
nav button:hover,nav button.on,.tools button:hover{color:var(--ink);background:var(--bg2)}
.tools{display:flex;gap:2px}

/* progress */
#prog{position:fixed;top:56px;left:0;height:2px;width:0;background:var(--accent);z-index:21;transition:width .15s}

/* stage */
main{padding:92px 16px 120px;display:flex;flex-direction:column;align-items:center;gap:28px}
.pg{
  position:relative;width:min(100%,1400px);aspect-ratio:1307/924;background:var(--bg2);
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 50px -20px rgba(42,27,24,.35);
  border-radius:3px;overflow:hidden;
}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s}
.pg.ready canvas{opacity:1}
.pg .shield{position:absolute;inset:0;z-index:2}   /* swallows every pointer event */
.pg .no{
  position:absolute;left:12px;bottom:10px;z-index:3;font:500 10px Archivo;letter-spacing:.14em;color:#0000;
}
.pg:not(.ready)::after{
  content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  background-size:200% 100%;animation:sh 1.4s infinite
}
@keyframes sh{from{background-position:200% 0}to{background-position:-100% 0}}

/* dock */
#dock{
  position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:4px;padding:6px;border-radius:99px;background:var(--bar);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.35);
}
#dock button{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--ink);font-size:16px;cursor:pointer}
#dock button:hover{background:var(--bg2)}
#count{font:500 12px Archivo;letter-spacing:.1em;min-width:76px;text-align:center;color:var(--mute)}
#count b{color:var(--ink)}

/* presentation mode */
body.present main{padding:0;gap:0;height:100vh;justify-content:center}
body.present header,body.present #prog{display:none}
body.present .pg{display:none;width:min(100vw,calc(100vh*1307/924));box-shadow:none;border-radius:0}
body.present .pg.cur{display:block}
body.present{background:#0e0b0a}

/* privacy cover — shown when focus leaves the tab / window */
#cover{
  position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;text-align:center;padding:24px
}
#cover.on{display:flex}
#cover h2{font:700 28px "Archivo Expanded",Archivo;letter-spacing:.2em}
#cover p{color:var(--mute);font-size:14px;max-width:34ch;line-height:1.5}

/* floating watermark */
#wm{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;opacity:.06;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #wm{mix-blend-mode:screen}}
#wm span{position:absolute;white-space:nowrap;font:600 13px "Archivo Expanded",Archivo;letter-spacing:.22em;transform:rotate(-24deg);color:var(--ink)}

#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login.off{display:none}
#lf{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
#lf h1{font:700 34px "Archivo Expanded",Archivo;letter-spacing:.16em}
#lf h1 span{font:500 18px Archivo;letter-spacing:0;color:var(--mute);margin-left:8px}
#lf p{color:var(--mute);font-size:14px;line-height:1.55;margin-bottom:6px}
#lf input{font:500 15px Archivo;letter-spacing:.14em;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink);-webkit-user-select:text;user-select:text}
#lf input:focus{outline:2px solid var(--accent);outline-offset:1px}
#lf button{font:600 13px Archivo;letter-spacing:.14em;text-transform:uppercase;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
#err{color:#b3261e;font-size:13px;min-height:18px}
/* never print */
@media print{html,body{display:none!important}}

@media (max-width:720px){
  .brand small{display:none}
  main{padding-top:84px;gap:16px;padding-inline:10px}
  nav button{padding:10px 9px;font-size:11px}
  .tools .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.pg canvas{transition:none}.pg:not(.ready)::after{animation:none}}
</style>
</head>
<body>

<header>
  <div class="brand">NAMUNA<small>नमूना · Collection 01 · Range Review, Oct 2026</small></div>
  <nav id="nav" aria-label="Sections">
    <button data-p="1">Cover</button>
    <button data-p="3">Contents</button>
    <button data-p="4">Men</button>
    <button data-p="12">Women</button>
    <button data-p="26">The Buy</button>
  </nav>
  <div class="tools">
    <button id="theme" title="Theme" aria-label="Toggle theme">◐</button>
    <button id="full" class="hide-s" title="Presentation mode" aria-label="Presentation mode">⤢</button>
  </div>
</header>
<div id="prog"></div>

<main id="stage" aria-label="Lookbook pages"></main>

<div id="dock">
  <button id="prev" aria-label="Previous page">←</button>
  <div id="count"><b>1</b> / 26</div>
  <button id="next" aria-label="Next page">→</button>
</div>

<div id="login"><form id="lf" autocomplete="off">
  <h1>NAMUNA <span>नमूना</span></h1>
  <p>Collection 01 · Range Review, October 2026<br>Private view. Enter the access code you were given.</p>
  <input id="code" type="password" placeholder="Access code" autocomplete="off" spellcheck="false" required>
  <button>View collection</button><div id="err" role="alert"></div>
</form></div>
<div id="wm" aria-hidden="true"></div>
<div id="cover"><h2>NAMUNA</h2><p>Viewing is paused while this window is not in focus. Return to this tab to continue.</p></div>

<script>
(() => {
  const TOTAL = 26;
  const stage = document.getElementById('stage');
  const count = document.getElementById('count');
  const prog = document.getElementById('prog');
  const cover = document.getElementById('cover');
  const pages = [];
  let stamp = 'Designed by adihuman.';
  let tokens = [], tokenExp = 0, started = false;

  /* ---------- theme ---------- */
  const root = document.documentElement;
  try { const t = localStorage.getItem('nm-theme'); if (t) root.dataset.theme = t; } catch(e){}
  document.getElementById('theme').onclick = () => {
    const dark = matchMedia('(prefers-color-scheme:dark)').matches;
    const cur = root.dataset.theme || (dark ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('nm-theme', next); } catch(e){}
  };

  /* ---------- pages: JPEG -> blob -> canvas. No <img>, no URL a user can open. ---------- */
  for (let i = 1; i <= TOTAL; i++) {
    const el = document.createElement('section');
    el.className = 'pg'; el.dataset.n = i;
    el.innerHTML = '<canvas></canvas><div class="shield"></div>';
    stage.appendChild(el);
    pages.push({ el, loaded:false, loading:false });
  }

  async function draw(p, n) {
    if (p.loaded || p.loading) return;
    p.loading = true;
    try {
      if (!tokens.length || Date.now() > tokenExp) await refresh();
      const res = await fetch('/api/page/' + n + '?t=' + encodeURIComponent(tokens[n-1]), { cache:'no-store', credentials:'same-origin' });
      if (res.status === 401) return lock();
      if (res.status === 403) { await refresh(); throw 0; }
      const bmp = await createImageBitmap(await res.blob());
      const c = p.el.querySelector('canvas');
      c.width = bmp.width; c.height = bmp.height;
      const g = c.getContext('2d');
      g.drawImage(bmp, 0, 0);
      bmp.close && bmp.close();
      p.el.classList.add('ready');
      p.loaded = true;
    } catch (e) { p.loading = false; }
  }

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!started) return;
    const n = +e.target.dataset.n, p = pages[n-1];
    if (e.isIntersecting) { draw(p, n); if (pages[n]) draw(pages[n], n+1); }
  }), { rootMargin:'900px 0px' });
  pages.forEach(p => io.observe(p.el));

  /* ---------- current page tracking ---------- */
  let cur = 1;
  const io2 = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { setCur(+e.target.dataset.n, false); }
  }), { rootMargin:'-45% 0px -45% 0px' });
  pages.forEach(p => io2.observe(p.el));

  const navBtns = [...document.querySelectorAll('#nav button')];
  function setCur(n, scroll = true) {
    cur = Math.max(1, Math.min(TOTAL, n));
    count.innerHTML = '<b>' + cur + '</b> / ' + TOTAL;
    prog.style.width = (cur / TOTAL * 100) + '%';
    pages.forEach((p,i) => p.el.classList.toggle('cur', i+1 === cur));
    let on = null; navBtns.forEach(b => { if (+b.dataset.p <= cur) on = b; });
    navBtns.forEach(b => b.classList.toggle('on', b === on));
    if (scroll && !document.body.classList.contains('present'))
      pages[cur-1].el.scrollIntoView({ block:'center', behavior:'smooth' });
    if (document.body.classList.contains('present')) { draw(pages[cur-1], cur); pages[cur] && draw(pages[cur], cur+1); }
  }
  navBtns.forEach(b => b.onclick = () => setCur(+b.dataset.p));
  document.getElementById('prev').onclick = () => setCur(cur-1);
  document.getElementById('next').onclick = () => setCur(cur+1);

  /* ---------- presentation mode ---------- */
  const full = document.getElementById('full');
  function togglePresent(force) {
    const on = force ?? !document.body.classList.contains('present');
    document.body.classList.toggle('present', on);
    if (on) { document.documentElement.requestFullscreen?.().catch(()=>{}); }
    else if (document.fullscreenElement) document.exitFullscreen?.();
    setCur(cur);
  }
  full.onclick = () => togglePresent();
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('present')) togglePresent(false);
  });

  /* ---------- keyboard ---------- */
  addEventListener('keydown', e => {
    const k = e.key, mod = e.ctrlKey || e.metaKey;
    // blocked combos: save, print, view-source, copy, select-all, devtools, mac screenshots
    if (k === 'PrintScreen' ||
        (mod && ['s','p','u','c','a','x'].includes(k.toLowerCase())) ||
        (mod && e.shiftKey && ['3','4','5','s','i','j','c'].includes(k.toLowerCase())) ||
        k === 'F12') { e.preventDefault(); e.stopPropagation(); hide(1200); return false; }
    if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && document.body.classList.contains('present'))) { e.preventDefault(); setCur(cur+1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); setCur(cur-1); }
    else if (k === 'Home') { e.preventDefault(); setCur(1); }
    else if (k === 'End') { e.preventDefault(); setCur(TOTAL); }
    else if (k.toLowerCase() === 'f') togglePresent();
  }, true);
  // Cmd / Win key held = a screenshot shortcut may be starting -> blank the page until it is released
  addEventListener('keydown', e => { if (e.key === 'Meta' || e.key === 'OS') hide(); }, true);
  addEventListener('keyup', e => { if (e.key === 'Meta' || e.key === 'OS') setTimeout(show, 600); });
  // Pointer leaves the window (heading for a snipping tool) -> blank; returns -> show
  if (matchMedia('(pointer:fine)').matches) {
    document.documentElement.addEventListener('mouseleave', () => hide());
    document.documentElement.addEventListener('mouseenter', () => show());
  }
  addEventListener('keyup', e => {
    if (e.key === 'PrintScreen') { try { navigator.clipboard.writeText(''); } catch(_){} hide(1500); }
  });

  /* ---------- block context menu, drag, select, copy, print ---------- */
  ['contextmenu','dragstart','selectstart','copy','cut','beforeprint'].forEach(t =>
    addEventListener(t, e => { e.preventDefault(); if (t==='beforeprint') hide(1500); }, true));
  addEventListener('beforeprint', () => hide(2000));
  addEventListener('touchstart', e => { if (e.touches.length > 2) e.preventDefault(); }, { passive:false });

  /* ---------- privacy cover: pause the view when focus leaves ---------- */
  let timer;
  function hide(ms) { cover.classList.add('on'); if (ms) { clearTimeout(timer); timer = setTimeout(show, ms); } }
  function show() { if (document.hasFocus() && !document.hidden) cover.classList.remove('on'); }
  addEventListener('blur', () => hide());
  addEventListener('focus', show);
  document.addEventListener('visibilitychange', () => document.hidden ? hide() : show());
  addEventListener('pagehide', () => hide());

  /* ---------- floating watermark ---------- */
  const wm = document.getElementById('wm');
  function buildWm(){ wm.innerHTML='';
  for (let y = 0; y < 3; y++) for (let x = 0; x < 1; x++) {
    const s = document.createElement('span');
    s.textContent = stamp;
    s.style.top = (y*30 + 20) + '%'; s.style.left = (18 + y*22) + '%';
    wm.appendChild(s);
  }}
  buildWm();

  /* ---------- devtools nudge (best-effort) ---------- */
  setInterval(() => {
    const open = outerWidth - innerWidth > 220 || outerHeight - innerHeight > 220;
    if (open && !document.body.classList.contains('present')) hide(); else if (!open) show();
  }, 1200);

  /* ---------- session: login, token refresh, lock ---------- */
  const login = document.getElementById('login'), err = document.getElementById('err');
  async function refresh() {
    const r = await fetch('/api/manifest', { credentials:'same-origin', cache:'no-store' });
    if (r.status === 401) { lock(); throw 0; }
    const m = await r.json(); tokens = m.tokens; tokenExp = Date.now() + 100000;
    stamp = 'Designed by adihuman.'; buildWm();
  }
  function lock() { started = false; tokens = []; login.classList.remove('off'); pages.forEach(p => { p.loaded = p.loading = false; p.el.classList.remove('ready'); }); }
  async function begin() {
    await refresh(); started = true; login.classList.add('off');
    pages.forEach(p => { const r = p.el.getBoundingClientRect(); if (r.top < innerHeight + 900) draw(p, +p.el.dataset.n); });
  }
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault(); err.textContent = '';
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code: document.getElementById('code').value }) });
    if (!r.ok) { err.textContent = r.status === 429 ? 'Too many attempts. Try again later.' : 'That code is not valid.'; return; }
    document.getElementById('code').value = '';
    try { await begin(); } catch (_) { err.textContent = 'Signed in, but the session was not saved. Open the site over https or http://localhost:3000.'; }
  };
  fetch('/api/manifest', { credentials:'same-origin' }).then(r => r.ok && begin()).catch(()=>{});
  setInterval(() => { if (started) refresh().catch(()=>{}); }, 90000);

  setCur(1, false);
})();
</script>
</body>
</html>
