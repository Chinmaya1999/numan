name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Tests
        run: npm test
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: No secrets or private assets committed
        run: |
          if git ls-files | grep -Ei '\.pem$|^private/|^data/|\.env$'; then
            echo "Sensitive file is tracked"; exit 1
          fi
