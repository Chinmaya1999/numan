name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency: { group: deploy, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }

      - name: Package release (code only; pages + data stay on the server)
        run: tar --exclude='.git*' --exclude=node_modules --exclude=private --exclude=data --exclude='*.pem' --exclude=test --exclude=electron -czf "$RUNNER_TEMP/release.tgz" .

      - name: SSH setup
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # printf keeps the newlines and adds the final one that OpenSSH requires
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null || { echo "EC2_SSH_KEY secret is not a valid private key. Paste the whole .pem file, including the BEGIN and END lines."; exit 1; }
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload and activate
        run: |
          scp -i ~/.ssh/key "$RUNNER_TEMP/release.tgz" deploy/activate.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/
          ssh -i ~/.ssh/key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'bash /tmp/activate.sh /tmp/release.tgz'

      - name: Smoke test (public HTTPS)
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://design.adihuman.com/healthz && exit 0; sleep 3
          done; exit 1
